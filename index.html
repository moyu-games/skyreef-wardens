<style>

}

.spRow2{display:flex;align-items:center;gap:8px;margin-top:3px}.spE{position:relative;flex:1;height:14px;border:2px solid var(--ink);border-radius:99px;background:rgba(27,26,51,.45);overflow:hidden}.spE i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#FF9AD0,#C04CFF)}.spE b{position:absolute;left:6px;top:-1px;font-size:11px;color:#fff;text-shadow:0 0 2px #000}

{id:'lich',name:'骨冠巫妖',cost:6,rar:'L',type:'troop',hero:1,place:'own',spawn:['lich',1],desc:'反派亡靈法師。登場召出 4 具骷髏；附近的敵人死掉會被拉起來變成骷髏（最多 6 具）。每第四下收割 3 個敵人的靈魂來回血。本人不耐打。'},
{id:'angel',name:'聖光天使',cost:5,rar:'L',type:'troop',hero:1,place:'own',spawn:['angel',1],desc:'會飛。降臨時替附近隊友補 40% 血並加護盾；每第四下召下審判之劍。附近有英雄隊友倒下時，能讓它復活一次。'},
{id:'panda',name:'竹林熊貓',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['panda',1],desc:'登場一路翻滾撞開敵人；很耐打，每第四掌震地讓周圍暈眩。血少時坐下來吃竹子回血。打不到空中。'},
{id:'ghost',name:'迷霧幽魂',cost:4,rar:'E',type:'troop',hero:1,place:'own',spawn:['ghost',1],desc:'登場嚇得附近敵人退開不敢打。每 3.5 秒有 1 秒變透明，打不到也不能打。冷冷一摸讓身邊一小圈敵人都變慢，每第三下穿過敵人身體。'},
{id:'mao',name:'喵喵大魔神',cost:8,rar:'L',type:'troop',hero:1,place:'own',spawn:['mao',1],desc:'戴皇冠的巨大貓神。登場一隻超大貓掌從天而降，砸扁一大片還砸到燈塔。眼睛射雷射，每第四下用喵喵光束橫掃一整片；還會把貼身的敵人「推下桌」。'},
{id:'voidk',name:'虛空皇帝',cost:6,rar:'L',type:'troop',hero:1,place:'own',spawn:['voidk',1],desc:'反派。在前方打開黑洞：吸住附近敵人慢慢扣血、把飛過來的子彈全吞掉，最後內爆。每第四下重力反轉，把敵人舉到半空再摔下來。有 30% 機率讓攻擊被虛空吞掉。'},
{id:'dino',name:'霸王龍特快',cost:6,rar:'E',type:'troop',hero:1,place:'own',spawn:['dino',1],desc:'小男孩騎著暴龍「小霸」一路衝撞登場。每第三口：小隻的敵人直接一口吞掉（還會回血），大隻的就大口咬。打不到空中。'},
{id:'rock',name:'電吉他狂人',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['rock',1],desc:'搖滾巨星登場來一段 solo：附近隊友嗨到出手變快，敵人被迫跟著跳舞不能打。音波遠程攻擊，每第四下強力和弦把前方一片震飛。'},
{id:'ama',name:'無敵阿嬤',cost:4,rar:'E',type:'troop',hero:1,place:'own',spawn:['ama',1],desc:'「哪個不乖的！」登場藍白拖滿天飛，追著附近每一個敵人打，打中就暈。每第三下開始念經，被念的敵人愣住一下。每 5 秒塞東西給受傷的隊友吃，幫它回血。'},
{id:'magnet',name:'磁極君王',cost:6,rar:'L',type:'troop',hero:1,place:'own',spawn:['magnet',1],desc:'反派。展開磁場 3 秒：飛進來的敵方子彈全部反彈回去，附近敵人被吸過來。用磁力線攻擊，每第四下砸下三根鋼樑。弱點：近戰部隊不吃反彈，貼身就危險。'},
{id:'sumo',name:'黑洞相撲',cost:6,rar:'E',type:'troop',hero:1,place:'own',spawn:['sumo',1],desc:'大肚子從天而降「咚——！」把周圍全彈開。每第三下：身邊有小兵就整隻吸進肚子，1 秒後「呸！」吐出去砸遠處的敵人；沒有小兵就張手突把人推飛。弱點：走很慢、打不到空中，怕飛行部隊。'},
{id:'mirrorm',name:'碎鏡伯爵',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['mirrorm',1],desc:'反派魔術師。登場碎鏡一閃，左右多出兩個鏡像分身。射出鏡片攻擊，每第四下直接和敵人「交換位置」，把對方換到自己的後排。有 20% 機率反射閃避。弱點：分身很脆，怕範圍攻擊。'},
{id:'painter',name:'畫中仙',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['painter',1],desc:'大毛筆一揮，在前方畫出一道墨牆，敵人會先跑去打牆。墨汁會讓人變慢；每第四筆畫出一條墨龍，從場邊橫掃過整條橫線。弱點：本人不耐打，怕刺客和繞過牆的飛行部隊。'},
{id:'clerk',name:'24H 店長',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['clerk',1],desc:'「叮咚～歡迎光臨！」登場自動門一開，附近隊友回血 30%。丟飯糰攻擊，每打中同一個敵人一次就蓋一格集點章，集滿 5 點當場「兌換」大爆炸。每 6 秒幫隊友補貨回血。弱點：本人很脆，怕刺客。'},
{id:'deliver',name:'極速外送俠',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['deliver',1],desc:'騎車登場，4 個「急件」包裹從天而降砸在敵人頭上。丟珍奶攻擊，濺一小圈還會黏住變慢；每第四下直接把包裹送到最近的敵方燈塔。弱點：血少，怕被近身。'},
{id:'phoenix',name:'烈陽鳳凰',cost:6,rar:'L',type:'troop',hero:1,place:'own',spawn:['phoenix',1],desc:'會飛。浴火降臨燒一圈，被燒到的會持續掉血。射火羽攻擊，每第四下灑下烈陽之羽。倒下時變成一顆火蛋，蛋撐過 4 秒就浴火重生（只能一次）。弱點：怕會打空中的遠程，記得趁蛋還沒孵化時打破。'},
{id:'mspider',name:'機蛛女皇',cost:6,rar:'E',type:'troop',hero:1,place:'own',spawn:['mspider',1],desc:'反派。登場撒下蛛網讓一片敵人變慢，再放出 4 架小無人機；之後每 5 秒補 2 架（最多 6 架）。每第三下叫一架無人機自爆衝撞。弱點：無人機很脆，怕範圍攻擊；本體走很慢，被坦克貼身就難脫身。'},
{id:'alch',name:'點金術士',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['alch',1],desc:'畫出等價交換陣：陣裡的敵人掉血、掉金幣，你多拿最多 2 點潮光。射出金光攻擊；每第四下把小兵「點石成金」，直接變成 1 點潮光。弱點：本人很脆，怕刺客和坦克。'},
{id:'mochi',name:'麻糬大王',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['mochi',1],desc:'Q 彈落地黏住一圈敵人。打人會黏住變慢，每第三下壓成麻糬大餅砸一圈。半血時「噗啾」分裂成兩隻小麻糬繼續打。弱點：打不到空中，怕飛行部隊。'},
{id:'vine',name:'藤蔓森姬',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['vine',1],desc:'喚醒森林：藤蔓竄出纏住附近敵人一下並變慢，再種下兩朵食人花。射荊棘攻擊，每第四下在敵人身邊再種一朵（最多 3 朵）。弱點：食人花是建築，怕法術和攻城部隊。'},
{id:'aibot',name:'幻覺 AI',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['aibot',1],desc:'「正在生成…完成！」登場生成 3 個幻覺分身（手指還多一根），分身沒有攻擊力，但會吸引敵人火力。丟對話泡泡攻擊；每第四下自信作答：多半答對打出大傷害，偶爾答錯會幫目標回血、改打別人。弱點：本人很脆，分身一碰範圍攻擊就消失。'},
{id:'scam',name:'詐騙頭目',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['scam',1],desc:'反派。「恭喜您中大獎！」登場撒下 2 張中獎傳單，敵人會跑去搶，傳單被打破或時間到就爆炸（其實是詐騙），頭目還會回一點血。打電話攻擊；每第三通「個資外洩」，一圈敵人之後受到的傷害變多。弱點：傳單是建築，法術一下就清光；本人很脆、走很慢。'},
{id:'climate',name:'氣候巫女',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['climate',1],desc:'「地球發燒了！」登場在前方升溫成熱浪區，5 秒內站在裡面的敵人一直掉血。每一下攻擊的天氣都不一樣：熱浪燒傷、冰雹砸一圈變慢、狂風把人吹退。弱點：熱浪區不會跟著走，敵人走出去就沒事；本人怕刺客。'},
{id:'algo',name:'演算法姬',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['algo',1],desc:'「為你推薦！」登場吹出同溫層泡泡，附近隊友得到護盾，並看敵人最多的是哪一類，立刻推送一個剋星（空中推鷹眼射手、一群小兵推焰狐忍者、坦克推夜梟騎士）。之後每 9 秒再推一次（同時最多 1 個）。每第四下讓目標滑不停，被拉過來。弱點：本人很脆；敵人兵種越雜，推薦越不準。'},
{id:'streamer',name:'直播網紅',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['streamer',1],desc:'「哈囉大家～開台囉！」登場帶 2 個粉絲一起打，之後每 12 秒有新粉絲加入（最多 3 個）。用自拍棒拍敵人，每第四下閃光燈讓目標停手一下；每拍 6 下收到斗內，金幣雨砸附近敵人並回血。弱點：粉絲很脆，怕範圍攻擊；本人單打很弱。'},
{id:'coinb',name:'迷因幣大亨',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['coinb',1],desc:'「上市囉！」登場灑一波幣雨。頭上有即時幣價，攻擊力跟著幣價漲跌。每第四下：幣價夠高就「獲利了結」打出超大傷害，然後崩盤；不夠高就加碼，讓幣價往上衝。弱點：崩盤後很弱；本人很脆，怕刺客。'},
{id:'deepf',name:'深偽怪客',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['deepf',1],desc:'反派。「哪個才是真的我？」登場換臉隱身 3.5 秒，誰都打不到，它會趁機摸到前線。現身後的第一擊「卸下假面」打出 2.5 倍傷害；之後每第四下再換一張臉，短暫隱身。弱點：血少；範圍法術等它現身時一下就能解決。'},
{id:'engr',name:'爆肝工程師',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['engr',1],desc:'「超頻！今晚不睡了」登場讓附近隊友攻速變快 4 秒。敲程式碼攻擊；每第四下「抓 bug」，一行程式碼串打 3 個敵人。血量低於一半時進入爆肝模式，攻速和傷害都提高。弱點：本人沒護甲，怕坦克貼身；超頻時間很短。'},
{id:'solar',name:'光電少女',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['solar',1],desc:'「太陽，借我一點光！」登場在兩側架起光電板，板子會自己射擊附近的敵人。用陽光射擊；每第四下「聚光」，射出一道貫穿整條線的光束。弱點：光電板是建築，怕法術和攻城部隊；本人很脆。'},
{id:'seaw',name:'海廢清道夫',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['seaw',1],desc:'「淨灘出動！」登場用大網撈一圈，把敵人拉近。用網子攻擊，打到的會變慢。附近有單位倒下就撿起垃圾（最多 5 個），每第三下把整袋垃圾揉成球丟回去，垃圾越多越痛。弱點：打不到空中；沒撿到垃圾時很普通。'},
{id:'hacker',name:'勒索駭客',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['hacker',1],desc:'反派。「你的檔案已被加密。」登場讓前方一圈敵人中勒索病毒，5 秒內一直掉血。每第三下再感染一個目標。中毒的單位倒下時，病毒會跳到附近另一個敵人身上繼續擴散。弱點：本人很脆；敵人分散站，病毒就傳不出去。'},
{id:'space',name:'太空旅客',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['space',1],desc:'搭火箭從天而降砸出一圈衝擊。用雷射槍攻擊，每第四下讓目標「無重力」飄起來停頓一下。血量剩 40% 時「返航」：飛上太空躲 1.5 秒，再砸進敵人最密集的地方並回一點血（只能一次）。弱點：返航用掉後很脆；怕快速的刺客。'},
{id:'taxi',name:'自駕計程車',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['taxi',1],desc:'「已為您規劃最佳路線！」登場往前直衝，撞飛路上的敵人。頭上的光達一直轉。近身撞人；每第四下「重新規劃路線」，對準目標再衝一次並把它撞開。弱點：打不到空中；只會直線衝，被繞到旁邊就很尷尬。'},
{id:'gym',name:'健身狂人',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['gym',1],desc:'「深蹲一百下！」登場震一圈。附近每倒下一個敵人就長一塊肌肉（最多 5 塊）：攻擊變強、身體變大、回一點血。每第三下啞鈴砸地打一圈。弱點：打不到空中；剛上場時很普通，被風箏就長不了肌肉。'},
{id:'vac',name:'掃地機器人',cost:4,rar:'R',type:'troop',hero:1,place:'own',spawn:['vac',1],desc:'「開始打掃～」登場把一圈敵人吸過來，順便吸掉飛過來的子彈。平常每 1.4 秒能吸掉一顆射向附近的子彈（燈塔的砲彈吸不掉）。每第三下強力模式打一圈。弱點：打不到空中；跑得慢的遠程部隊一直風箏它就很吃虧。'},
{id:'storm',name:'風暴女神',cost:5,rar:'L',type:'troop',hero:1,place:'own',spawn:['storm',1],desc:'在前方召來雷雨雲，3 秒內不斷落雷劈附近敵人。用狂風遠程攻擊會把人吹退，每第四下放出龍捲風，一路捲著敵人往前走。弱點：本人很脆，怕刺客近身。'},
{id:'claw',name:'不死鋼爪',cost:5,rar:'E',type:'troop',hero:1,place:'own',spawn:['claw',1],desc:'從天而降一爪劃開一片。身體會一直自己癒合，血越少打越快（狂暴）；每第四下連斬 5 刀並吸血。弱點：單體近戰、打不到空中，怕人海和飛行部隊。'},
{id:'mimic',name:'千面獸',cost:4,rar:'E',type:'troop',hero:1,place:'own',spawn:['mimic',1],desc:'每 4.5 秒變一次身：鐵甲犀牛（衝撞）→疾風巨鷹（會飛、射羽毛）→鋼刺刺蝟（護盾＋刺一圈）。登場先變犀牛衝一段。弱點：每種形態都只強一半，看準形態就好剋。'},
{id:'blinkr',name:'瞬影魔',cost:3,rar:'R',type:'troop',hero:1,place:'own',spawn:['blinkr',1],desc:'「抓～不～到～」每一擊前都瞬移到敵人身側；登場連閃 4 個敵人各砍一刀。每第四下把小兵往後傳送一大段（英雄傳不走）。弱點：血少又只能單打，怕範圍攻擊。'},
];

  if(e.uid==='flyer'){const T=e.team,x=e.x,y=e.y;addFx({k:'boom',x,y,r:30,dur:.45});addFx({k:'txt',x,y:y-30,s:'其實是詐騙！',col:'#E8283B',dur:1.1,size:13});sfx('boom');foesAt(T,x,y,40,false).forEach(f=>{if(f.kind==='unit')hurt(f,90*e.m,T)});if(e.boss&&e.boss.hp>0){e.boss.hp=Math.min(e.boss.max,e.boss.hp+e.boss.max*.08)}}
  if(e.uid==='hallu'){addFx({k:'pixgen',x:e.x,y:e.y-14,r:20,dur:.5})}}

function b10Cast(T,uid,us,x,y,m){const u0=us[0],lv=u0.lv,dir=T===0?-1:1;
  if(uid==='coinb'){sfx('h_ipo');u0.price=1;addFx({k:'coinrain',x,y,r:70,dur:1.2});addFx({k:'txt',x,y:y-62,s:'上市囉！衝一波！',col:'#E0A000',dur:1.3,size:16});later(.5,()=>foesAt(T,x,y,70,false).forEach(e=>{if(e.kind==='unit')hurt(e,110*m,T)}));return}
  if(uid==='seaw'){sfx('h_net');addFx({k:'netsweep',x,y:y+dir*24,r:62,dur:.8});addFx({k:'txt',x,y:y-60,s:'淨灘出動！',col:'#2E7BFF',dur:1.2,size:16});
    later(.3,()=>foesAt(T,x,y+dir*24,62,false).forEach(e=>{if(e.kind!=='unit'||e.building)return;hurt(e,70*m,T);const d=Math.hypot(e.x-x,e.y-y)||1;e.x=clamp(e.x-(e.x-x)/d*22,10,W-10);e.y=clamp(e.y-(e.y-y)/d*22,10,H-10)}));u0.trash=2;return}
  if(uid==='engr'){sfx('h_overclock');addFx({k:'codeburst',x,y:y-20,r:80,dur:1.3});addFx({k:'txt',x,y:y-62,s:'超頻！今晚不睡了',col:'#2E7BFF',dur:1.3,size:16});
    later(.25,()=>G.ents.forEach(e=>{if(e.team===T&&e.kind==='unit'&&e.hp>0&&!e.building&&dist(e,{x,y})<85){e.buff=Math.max(e.buff,4);addFx({k:'txt',x:e.x,y:e.y-30,s:'⚡',col:'#2E7BFF',dur:.8,size:14})}}));return}
  if(uid==='solar'){sfx('h_solar');addFx({k:'sunbeams',x,y,r:70,dur:1.2});addFx({k:'txt',x,y:y-62,s:'太陽，借我一點光！',col:'#FF8A1F',dur:1.3,size:15});
    for(const i of[-1,1]){const px=clamp(x+i*34,12,W-12),py=clamp(y+dir*10,12,H-12);later(.4,()=>{const p=mkUnit(T,'panel',px,py,lv);p.dep=.2;addFx({k:'sunbeams',x:px,y:py,r:24,dur:.6})})}return}
  if(uid==='deepf'){sfx('h_glitch');u0.stealth=3.5;addFx({k:'glitch',x,y:y-20,r:40,dur:1.0});addFx({k:'txt',x,y:y-62,s:'哪個才是真的我？',col:'#7B3FF0',dur:1.3,size:15});u0.unmask=1;return}}

  if(u.uid==='taxi'){if(n%4===0&&t.kind==='unit'&&!t.building){sfx('h_honk');addFx({k:'txt',x:u.x,y:u.y-46,s:'重新規劃路線…',col:'#E0A000',dur:.9,size:12});const dx=t.x-u.x,dy=t.y-u.y;addFx({k:'skid',x1:u.x,y1:u.y,x2:t.x,y2:t.y,dur:.6});b11Dash(u,dx,dy,Math.min(60,Math.hypot(dx,dy)+20),d*1.8,T);return true}
    sfx('h_bump');addFx({k:'honk',x:t.x,y:t.y-16,dur:.4});return false}
  if(u.uid==='gym'){if(n%3===0){sfx('h_squat');const tx=t.x,tyy=t.y;addFx({k:'flexring',x:tx,y:tyy,r:30+(u.gains||0)*3,dur:.45});addFx({k:'txt',x:u.x,y:u.y-56,s:'啞鈴落地！',col:'#FF4D6A',dur:.8,size:13});later(.15,()=>foesAt(T,tx,tyy,30+(u.gains||0)*3,true).forEach(e=>hurt(e,TWF(e)*d*1.5,T)));return true}
    sfx('h_bump');return false}
  if(u.uid==='space'){if(n%4===0&&t.kind==='unit'&&!t.building){sfx('h_float');addFx({k:'zerog',e:t,dur:.9});addFx({k:'txt',x:t.x,y:t.y-34,s:'無重力！',col:'#2E7BFF',dur:.8,size:12});t.stunT=Math.max(t.stunT,.5);later(.2,()=>{if(t.hp>0)hurt(t,d*1.6,T)});return true}
    sfx('h_laser');addFx({k:'beam',x1:u.x+u.face*12,y1:u.y-34,x2:t.x,y2:ty,col:'#4DE3FF',w:1.8,dur:.15});later(.08,()=>{if(t.hp>0)hurt(t,d,T)});return true}
  if(u.uid==='hacker'){if(n%3===0&&t.kind==='unit'&&!t.building){sfx('h_hack');addFx({k:'txt',x:t.x,y:t.y-34,s:'已感染',col:'#13955A',dur:.8,size:12});b11Infect(t,T,u.m)}
    sfx('h_zap');addFx({k:'virusline',x1:u.x+u.face*10,y1:u.y-30,x2:t.x,y2:ty,dur:.18});later(.12,()=>{if(t.hp>0)hurt(t,d,T)});return true}
  if(u.uid==='vac'){if(n%3===0){sfx('h_vacuum');addFx({k:'suckin',x:u.x,y:u.y,r:36,dur:.5});addFx({k:'txt',x:u.x,y:u.y-30,s:'強力模式！',col:'#3A4E9E',dur:.8,size:12});foesAt(T,u.x,u.y,36,true).forEach(e=>hurt(e,TWF(e)*d*1.4,T));return true}
    sfx('h_bump');return false}
  return false}
/* --- 被動 --- */
function b11Tick(u,dt){
  if(u.uid==='vac'){u.vcd=(u.vcd||0)-dt;if(u.vcd<=0){const p=G.projs.find(p=>!p.dead&&p.team!==u.team&&p.k!=='tower'&&Math.hypot(p.x-u.x,p.y-u.y)<46);if(p){p.dead=true;u.vcd=1.4;addFx({k:'suckin',x:u.x,y:u.y,r:20,dur:.3});addFx({k:'txt',x:u.x,y:u.y-28,s:'吸掉！',col:'#3A4E9E',dur:.6,size:11})}}}
  if(u.uid==='space'&&!u.flew&&u.hp>0&&u.hp<u.max*.4){u.flew=1;u.stealth=1.6;const T=u.team;sfx('h_rocket2');addFx({k:'txt',x:u.x,y:u.y-50,s:'返航！',col:'#2E7BFF',dur:1,size:14});addFx({k:'rocketup',x:u.x,y:u.y,dur:.8});
    later(1.5,()=>{if(u.hp<=0)return;const fo=G.ents.filter(e=>e.team!==T&&e.hp>0&&e.kind==='unit'&&!e.building&&!(e.stealth>0));let best=null,bc=0;for(const e of fo){const cnt=fo.filter(f=>dist(f,e)<60).length;if(cnt>bc){bc=cnt;best=e}}
      if(best){let ny=best.y;if(T===0)ny=Math.max(ny,RV+BAND+26);else ny=Math.min(ny,RV-BAND-26);u.x=best.x;u.y=ny}addFx({k:'rocketfall',x:u.x,y:u.y,dur:.4});later(.4,()=>{addFx({k:'ring',x:u.x,y:u.y,r0:8,r1:66,col:'#9FDFFF',dur:.5,fill:1});G.shake=Math.max(G.shake,.3);foesAt(T,u.x,u.y,66,false).forEach(e=>hurt(e,TWF(e)*160*u.m,T));u.hp=Math.min(u.max,u.hp+u.max*.15)})})}
  return false}
function b11Death(e){if(!G||e.kind!=='unit')return;
  if(e.virusU>G.t){const T=e.virusT;const nx=G.ents.filter(f=>f.team===e.team&&f!==e&&f.hp>0&&f.kind==='unit'&&!f.building&&!(f.virusU>G.t)).sort((p,q)=>dist(p,e)-dist(q,e))[0];if(nx&&dist(nx,e)<85){addFx({k:'virusline',x1:e.x,y1:e.y-8,x2:nx.x,y2:nx.y-8,dur:.4});addFx({k:'txt',x:nx.x,y:nx.y-30,s:'病毒擴散！',col:'#13955A',dur:.9,size:12});b11Infect(nx,T,e.virusM||1)}}
  if(e.uid==='gym')return;for(const s of G.ents){if(s.uid==='gym'&&s.hp>0&&s.team!==e.team&&dist(s,e)<70&&(s.gains||0)<5){s.gains=(s.gains||0)+1;s.dmg*=1.08;s.hp=Math.min(s.max,s.hp+s.max*.06);addFx({k:'txt',x:s.x,y:s.y-50,s:'肌肉 +1！',col:'#FF4D6A',dur:.8,size:12})}}}

function rollR(odds){let x=rnd()*100;for(let i=0;i<4;i++){if(x<odds[i])return RORD[i];x-=odds[i]}return 'C'}
function pickOf(r,pool){let i=RORD.indexOf(r),l=[];while(i<4&&!(l=CARDS.filter(c=>c.rar===RORD[i]&&(!pool||c[pool]))).length)i++;if(!l.length)l=CARDS.filter(c=>!pool||c[pool]);return l[Math.floor(rnd()*l.length)].id}
function genChest(ch,forceL){const ids=[];for(let i=0;i<ch.n;i++)ids.push(pickOf(rollR(ch.odds),ch.pool));
  const minI=forceL?3:ch.min?RORD.indexOf(ch.min):-1;if(minI>=0&&!ids.some(id=>RORD.indexOf(CARD[id].rar)>=minI))ids[ids.length-1]=pickOf(RORD[minI],ch.pool);
  return ids.sort((a,b)=>RORD.indexOf(CARD[a].rar)-RORD.indexOf(CARD[b].rar))}
function applyCards(ids){return ids.map(id=>{const o=S.owned[id];let isNew=false,up=false;if(!o){S.owned[id]={lv:1,cp:0};isNew=true}else{o.cp++;while(o.lv<9&&o.cp>=need(o.lv)){o.cp-=need(o.lv);o.lv++;up=true}}return{id,isNew,up,lv:S.owned[id].lv}})}
let chestHTML=(c1,c2,glow)=>`<div class="chest" style="--c1:${c1};--c2:${c2};--glow:${glow||'#fff'}"><div class="glow"></div><div class="bd"></div><div class="lid"></div><div class="band"></div><div class="gem"></div></div>`;
function openChest(ch,free){if(!free&&!S.admin.coins){if(S.coins<ch.cost)return;S.coins-=ch.cost}const ids=genChest(ch,free);const res=applyCards(ids);if(free)S.first=false;save();updTop();
  const top=Math.max(...ids.map(id=>RORD.indexOf(CARD[id].rar)));const glow=['#FFFFFF','#9CCBFF','#D2B0FF','#FFD36E'][top];
  const o=ov(`<div class="rays" id="rays"></div><div class="flash" id="flash"></div><button class="skip gbtn b-white" id="skipAll">全部略過</button>
   <div class="ovTitle gt" id="ovT">${esc(free?'啟航禮包':ch.name)}</div><div id="stage" style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center">${chestHTML(free?'#FFE38A':ch.c1,free?'#FF7A45':ch.c2,glow).replace('class="chest"','class="chest" id="chest"')}</div>
   <p class="ovSub gt" id="ovS">點寶箱開啟</p>`);
  let taps=0,i=-1,opened=false;const chest=$('#chest');
  const tapChest=()=>{if(opened)return;taps++;chest.classList.remove('shake');void chest.offsetWidth;chest.classList.add('shake');sfx('chest');
    if(taps===1){$('#ovS').textContent=top>=2?'裡面有東西在發光⋯⋯再點一下！':'再點一下！';$('#rays').style.setProperty('--ray',glow);$('#rays').classList.add('on')}
    if(taps>=2){opened=true;chest.classList.add('open');$('#flash').classList.add('go');confettiBurst([ch.c1,ch.c2,'#FFFFFF'],60);setTimeout(next,600)}};
  o.addEventListener('click',e=>{if(e.target.id==='skipAll'){summary();return}if(!opened){tapChest();return}if(i>=0&&i<res.length&&!$('#sumBtn'))next()});
  function next(){i++;if(i>=res.length){summary();return}const r=res[i],c=CARD[r.id],rar=RAR[c.rar];
    $('#ovT').innerHTML=`<span style="color:#fff">${rar.n}</span>`;
    const tags=`<span class="tag rar" style="background:${rar.c}">${rar.n}・${TYPEN[c.type]}${c.meme?'・台味':''}${c.hero?'・超級英雄':''}</span>${r.isNew?'<span class="tag new">新卡！</span>':''}${r.up?`<span class="tag up">升級 Lv.${r.lv}</span>`:(!r.isNew?`<span class="tag">+1 張（${S.owned[r.id].cp}/${need(S.owned[r.id].lv)}）</span>`:'')}`;
    $('#stage').innerHTML=`<div class="revealCard">${cardHTML(r.id)}</div><div class="rtag">${tags}</div><p class="rdesc">${esc(c.desc)}</p><div class="count gt">${i+1} / ${res.length}</div>`;
    $('#ovS').textContent='點一下看下一張';
    const ray=$('#rays');ray.style.setProperty('--ray',{C:'#FFFFFF',R:'#A9CFFF',E:'#E0C6FF',L:'#FFE08A'}[c.rar]);ray.classList.toggle('on',c.rar!=='C'||r.isNew);
    const fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;
    if(c.rar==='L'){fl.classList.add('go');sfx('legend');confettiBurst(['#FFD36E','#FF9A1F','#FFFFFF','#FF5DA2'],160);const lt=document.createElement('div');lt.className='legendTxt';lt.textContent=r.isNew?'傳說登場':'傳說再臨';o.appendChild(lt);setTimeout(()=>lt.remove(),2200)}
    else if(c.rar==='E'){fl.classList.add('go');sfx('rare');confettiBurst(['#C69BFF','#7B3FF0','#FFFFFF'],70)}
    else if(r.isNew){sfx('rare')}else sfx('card')}
  function summary(){i=res.length;$('#skipAll')&&$('#skipAll').remove();$('#rays').classList.remove('on');$('#ovT').textContent='這次拿到';
    $('#stage').innerHTML=`<div class="sumGrid">${res.map(r=>`<div class="wrap">${cardHTML(r.id,{lv:r.lv})}${r.isNew?'<span class="badge" style="background:var(--red)">新卡</span>':r.up?'<span class="badge" style="background:var(--green)">升級</span>':''}</div>`).join('')}</div><button class="btn gbtn b-gold" id="sumBtn">收下</button>`;
    $('#ovS').textContent=res.some(r=>r.isNew)?'新卡可以到「卡牌」頁放進牌組。':'';
    $('#sumBtn').onclick=e=>{e.stopPropagation();closeOv();render_view()}}

const NOTES={49:'雙人對戰小更新：為之後的公開版準備邀請連結（點連結就能直接加入房間）；在 claude.ai 上的玩法不變。',48:'第 11 批，科技和生活時事：勒索駭客（反派，病毒會擴散）、太空旅客（返航後砸進敵陣）、自駕計程車（直線衝撞）、健身狂人（越打肌肉越大）、掃地機器人（會吸掉子彈）。',47:'第 10 批，繼續跟時事有關：迷因幣大亨（攻擊力跟著幣價漲跌，會崩盤）、深偽怪客（反派，換臉隱身）、爆肝工程師（幫隊友超頻）、光電少女（架光電板自動射擊）、海廢清道夫（撿垃圾揉成球丟回去）。',46:'統計表可以自己重新模擬：在「角色勝率」頁按 500／2000／5000 場，就會在你的裝置上跑電腦對打並重算勝率，可隨時停止，不影響存檔。觀戰室的 AI 場可以按「換一場」或「全部換新」。',45:'觀戰室升級：上方顯示紅方手牌、下一張和潮光，下方是藍方，雙方怎麼出牌都看得到；電腦出牌前會想 0.8～1.5 秒，不會秒出；右上可切換 0.5×／1×／2× 速度。',44:'第 9 批，跟 AI 和時事有關：幻覺 AI（生成會吸引火力的分身，偶爾答錯）、詐騙頭目（反派，撒中獎傳單騙人過去再爆炸）、直播網紅（帶粉絲、收斗內）、氣候巫女（熱浪區，每一下天氣都不一樣）、演算法姬（看敵人出什麼，就推送剋星）。',43:'新增觀戰室（主畫面）：同時 3 場電腦高手對打（AI 場，等級 9、常用推薦牌組），可以隨時切換觀看，雙方都會喊出戰術。',42:'全面平衡：電腦對打 2000 場算出每張卡的勝率，太強的削弱、太弱的加強（月影怪盜不再入場偷潮光、心智孢子改 5 費、深淵魔君再削弱）。設定裡新增「角色勝率統計表」和「推薦牌組」，推薦牌組可以一鍵套用。',41:'第 8 批：烈陽鳳凰（倒下會變火蛋再重生）、機蛛女皇（反派，一直放小無人機）、點金術士（把小兵變成潮光）、麻糬大王（半血分裂成兩隻）、藤蔓森姬（種食人花）。',40:'燈塔射程加大（公主塔 112→135、國王塔 118→140），我方半場除了橋頭都在塔的保護範圍內；拖卡出兵時會用淡藍虛線畫出自己燈塔的射程。',39:'絲線人偶師的操控時間縮短：一般部隊 3 秒、英雄 2 秒（英雄現在也抓得住了）。剋制表整張重算，新英雄都會出現在「擅長對付」和「怕」裡。',38:'第 7 批，走奇葩路線：黑洞相撲（把小兵吸進肚子再吐出去）、碎鏡伯爵（反派，會跟敵人交換位置）、畫中仙（畫牆擋人、畫墨龍橫掃）、24H 店長（集滿 5 點就兌換大爆炸）、極速外送俠（把包裹直接送到燈塔）。',37:'剋制表全部重算，所有英雄都會出現在每張卡的「擅長對付／怕」裡，電腦也會用新的表來挑剋制卡。深淵魔君降臨的暈眩縮短到 0.5 秒。',36:'第 6 批，能力派：不死鋼爪（自癒＋狂暴）、風暴女神（雷雨雲和龍捲風）、磁極君王（反派，子彈會被反彈）、瞬影魔（每一擊都瞬移到背後）、千面獸（犀牛、老鷹、刺蝟輪流變）。另外依新規則，所有英雄的暈眩和定身都縮到 0.5 秒以內；竹林熊貓調弱。',35:'新增挑戰模式（主畫面「對戰」下面）：英雄聯軍、反派軍團、魔王降臨三種，電腦全派英雄、等級更高，贏了拿 500～1100 金幣，不影響獎盃。',34:'更新時會停在你原本的畫面：在卡牌頁就留在卡牌頁（連捲動位置都保留），只有正在對戰時才會接回那一場。',33:'第 5 批，越來越扯：喵喵大魔神（8 費巨貓，貓掌從天而降）、虛空皇帝（反派，黑洞會吞子彈）、霸王龍特快（一口吞小怪）、電吉他狂人（全場被迫跳舞）、無敵阿嬤（藍白拖追著打、念經讓你不敢動）。',32:'部隊倒下時會冒一團白煙、飄出小幽靈，英雄倒下則飄出金色星星',31:'燈塔被打中會噴碎石；被打倒時塔身會下沉崩塌、揚起塵土，皇冠彈出來並寫「+1 皇冠！」',30:'第 4 批 5 位：赤焰龍騎（會飛的 7 費大傢伙）、骨冠巫妖（反派，敵人死了會變骷髏）、聖光天使（能讓倒下的英雄復活）、竹林熊貓、迷霧幽魂。',29:'法術落下時有衝擊環、放射光線、中心閃光和火花，每個法術顏色不同，對手放的法術也看得出來',28:'剋制改成靠特性相剋，不再一直暈：新卡「紙紮兵團」用人海圍死單體慢攻的英雄，但怕範圍攻擊；狗仔改成閃光吸引英雄火力；道士不再緩速。每張卡的詳情頁會寫「擅長對付」和「怕」誰。',27:'電腦每場隨機帶 3～5 位英雄，把英雄當一般卡用。管理員面板新增「自動解鎖全部卡」，打開後新卡上線就直接解鎖。',26:'拖卡出兵時看得更清楚：不能放的區域有紅色斜線，放置點有呼吸光圈、整隊部隊的殘影和卡名標籤，潮光不夠會直接顯示還差幾點',25:'第 3 批 5 位：絲線人偶師（反派，能操控敵人）、赤鬼武士、時砂旅者、狂笑小丑（反派）、浪潮祭司（會幫隊友補血）。',24:'剋英雄卡削弱：英雄有「霸體」，連續被控 1 秒就掙脫並 2 秒免控；狗仔閃光只暈 0.6 秒，封印縮短、多受傷害降到 +20%。剋制卡現在是削弱英雄，不會讓英雄完全不能動。',23:'再來 5 位：深淵觸手魔、冰封女帝（反派）、狂博士（反派）、月嚎狼人、百獸馴師。狼人會變身，馴師帶獅子和野豬，女帝的冰能把人整個凍住。',22:'卡片詳情面板重新整理（拖曳把手、彩色數值格、條紋進度條），手牌付得起時有白色內框',21:'角色改成大頭 Q 版比例，五官跟著放大，看起來更可愛',20:'潮光被偷或被凍結時，潮光條會閃紅或變冰藍，並寫出原因（例如「-2 被月影怪盜偷走」）。怪盜掉包改成每 6 秒最多一次，凍結齒輪改成 4 秒。',19:'放進出戰牌組的卡不會再出現在收藏區；戰場上的血條、出兵落地的衝擊環和首頁更新說明卡都重新設計',18:'電腦出牌更有策略：不再把小兵一隻隻送死、不亂丟法術打健康的塔、費用落後時先存費再反擊。塔變得更耐打，比賽不會太快結束。',17:'新英雄 5 位：鐵鉤船長、緋月伯爵（反派吸血鬼）、星塵航員、金鐘和尚、沙漠快槍手。每位都有自己的出場大招、招牌技和音效，也都有更便宜的卡能剋制。',16:'可以幫任何卡改名字：在卡牌頁點一張卡，輸入名字按「改名」。名字只存在你這台裝置。',15:'深淵魔君削弱：降臨只影響附近部隊、對手潮光改成 -1、血量和吸血降低。電腦碰到大魔王會全力出剋制卡，單出魔君不會再一路推到底。',14:'燈塔、寶箱和開箱動畫全部重畫，介面加上按鈕手感和轉場，角色多了明暗、臉頰和英雄的肌肉線條。',13:'每張卡都有剋得掉的牌：被封印的英雄受到的傷害 +35%，水晶塔燒英雄更痛，10 費深淵魔君用 7 費的組合就能擋。電腦會看你出什麼，拿剋制卡回應，但不會強到不合理。',12:'剋英雄卡變強：被封印的英雄多受 35% 傷害，抗能水晶塔打英雄更痛。新英雄和反派被貼符後，一樣放不出招牌技能。',11:'新增一批原創英雄和反派（含 10 費的深淵魔君），電腦每場都會帶 2～4 位英雄上場；修正部隊和英雄卡在橋頭、塔後面不動的問題。',10:'更新時不會再把你踢出對戰：頁面重新載入後會自動接回原本那一場，更新說明回到主畫面才顯示。另外新增 5 張剋英雄卡、每種角色不同的普攻特效，並修正卡頓。'};
const RESUME_KEY='skyreef_resume_v1';let snapT=0;
function snapBattle(){try{if(!G||G.auto||G.headless||G.over||G.spec)return;const idx=new Map();G.ents.forEach((e,i)=>idx.set(e,i));
  const ser=(v,d)=>{if(typeof v==='function')return undefined;if(v===null||typeof v!=='object')return v;if(d>0&&idx.has(v))return {__e:idx.get(v)};if(d>5)return undefined;if(Array.isArray(v))return v.map(x=>ser(x,d+1));const o={};for(const k in v){const r=ser(v[k],d+1);if(r!==undefined)o[k]=r}return o};
  const flat=e=>{const o={};for(const k in e){const r=ser(e[k],1);if(r!==undefined)o[k]=r}return o};
  const g={};for(const k of['arena','t','time','dbl','evT','log','chal'])g[k]=G[k];
  const d={at:Date.now(),deck:S.deck,alv:G.P[1].lv('x'),g,ents:G.ents.map(flat),P:G.P.map(p=>{const o=flat(p);delete o.lv;return o}),projs:G.projs.map(flat),zones:G.zones.map(flat),wx:G.wx?flat(G.wx):null,T:G.T.map(r=>r.map(t=>idx.get(t))),style:G.aiStyle?AI_STYLES.indexOf(G.aiStyle):-1};
  sessionStorage.setItem(RESUME_KEY,JSON.stringify(d))}catch(e){}}
function clearSnap(){try{sessionStorage.removeItem(RESUME_KEY)}catch(e){}}
function resumeBattle(){let d=null;try{d=JSON.parse(sessionStorage.getItem(RESUME_KEY)||'null')}catch(e){}if(!d||!d.ents||Date.now()-d.at>15*60*1000)return false;
  try{const deck=(d.deck||[]).filter(id=>CARD[id]);if(deck.length===8)S.deck=deck;
    const opp=[...d.P[1].hand.map(h=>h.id),...d.P[1].q].filter(id=>CARD[id]).slice(0,8);
    startBattle({arena:d.g.arena,opp:opp.length===8?opp:null,resumed:1});
    const ents=d.ents.map(o=>Object.assign({},o));
    const fix=v=>{if(v&&typeof v==='object'){if(!Array.isArray(v)&&'__e' in v&&Object.keys(v).length===1)return ents[v.__e]||null;if(Array.isArray(v))return v.map(fix);for(const k in v)v[k]=fix(v[k])}return v};
    ents.forEach(e=>{for(const k in e)e[k]=fix(e[k])});
    G.ents=ents;G.T=d.T.map(r=>r.map(i=>ents[i]));G.projs=d.projs.map(fix).filter(q=>q.tgt);G.zones=d.zones.map(fix);G.wx=d.wx?fix(d.wx):null;

  else if(id==='boss'){pick.push('demon');add(H.filter(c=>c.cost>=6&&c.id!=='demon').slice(0,3));add(H.filter(c=>c.cost<=4))}

function hostSnapshot(){const t0=now();HO.seq++;const base=HO.keys.get(HO.ackKey);const full=!base||HO.seq-HO.lastFull>=KEY_EVERY;
  const ents=G.ents.filter(e=>e.hp>0||e.kind==='tower').map(e=>{const o=serEnt(e);o['#']=idOf(e);return o});
  const projs=G.projs.map(p=>{const o=serEnt(p);o['#']=idOf(p);return o});
  let E=ents,Pj=projs;
  if(full){const km={};for(const o of ents.concat(projs))km[o['#']]=o;HO.keys.set(HO.seq,km);HO.lastFull=HO.seq;for(const k of HO.keys.keys())if(k<HO.ackKey||HO.keys.size>6&&k!==HO.ackKey&&k<HO.seq-60)HO.keys.delete(k)}
  else{const dif=o=>{const k=base[o['#']];if(!k)return o;const d={'#':o['#']};for(const f in o){const a=o[f],b=k[f];if(a!==b&&(typeof a!=='object'||a===null||JSON.stringify(a)!==JSON.stringify(b)))d[f]=o[f]}return d};E=ents.map(dif);Pj=projs.map(dif)}
  const s={t:'snap',s:HO.seq,k:full?HO.seq:HO.ackKey,full,ar:G.arena|0,nm:full?[myName(),HO.guestName]:undefined,at:Date.now(),gt:Math.round(G.t*100)/100,time:Math.round(G.time*100)/100,dbl:G.dbl,over:G.over,res:G.res,
    wx:G.wx?serEnt(G.wx):null,zones:G.zones.map(z=>serEnt(z)),P:[serP(G.P[0]),serP(G.P[1])],T:G.T.map(a=>a.map(idOf)),ents:E,projs:Pj,
    fx:HO.out.fx.splice(0,60),parts:HO.out.parts.splice(0,40),sfx:[...new Set(HO.out.sfx.splice(0))].slice(0,6),toast:HO.out.toast.splice(0),ack:HO.lastN,pong:HO.lastPing};
  HO.out.parts.length=0;
  const bytes=NET.tx.send(s);NET.stats.snapBytes.push(bytes);if(NET.stats.snapBytes.length>600)NET.stats.snapBytes.shift();(NET.stats.serMs=NET.stats.serMs||[]).push(now()-t0)}

/* ---------- 快照套用（對手，轉 180 度） ---------- */
const XK=new Set(['x','ex','x1','x2','tx','cx','ax','px','ox','lx','bx','sx']),YK=new Set(['y','ey','y1','y2','ty','cy','ay','oy','ly','by','sy']);
const COL={'#2E7BFF':'#FF4D6A','#FF4D6A':'#2E7BFF','#1849B8':'#B81F3C','#B81F3C':'#1849B8'};
function mir(o,d){if(!o||typeof o!=='object')return o;if(Array.isArray(o))return o.map(x=>mir(x,d+1));if(o['@']!=null)return o;
  const r={};for(const k in o){let v=o[k];
    if(typeof v==='number'){if(XK.has(k))v=W-v;else if(YK.has(k))v=H-v;else if(k==='vx'||k==='vy'||k==='face')v=-v;else if((k==='a'||k==='rot'||k==='ang')&&d===0)v=v+Math.PI;else if(k==='team'&&(v===0||v===1))v=1-v}
    else if(typeof v==='string'&&COL[v])v=COL[v];
    else if(k==='tr'&&Array.isArray(v))v=v.map((n,i)=>i%2?H-n:W-n);
    else if(v&&typeof v==='object')v=mir(v,d+1);
    r[k]=v}return r}
const Gs={mirror:true,raw:new Map(),keys:new Map(),byId:new Map(),last:null,lastSeq:0,pending:new Map(),nextN:0,overShown:false,lastRecv:0};
function guestApply(s){const st=NET.stats;st.snaps++;const t=now();if(Gs.lastRecv)st.gapMax=Math.max(st.gapMax,t-Gs.lastRecv);Gs.lastRecv=t;st.lastSnapAt=t;
  st.oneWay.push(Date.now()-s.at);if(st.oneWay.length>600)st.oneWay.shift();
  if(s.s<=Gs.lastSeq||!G||!G.net)return;Gs.lastSeq=s.s;
  const res=v=>{if(v&&typeof v==='object'){if(v['@']!=null)return Gs.byId.get(v['@'])||null;for(const k in v)v[k]=res(v[k])}return v};
  const M=Gs.mirror?mir:(o=>o&&typeof o==='object'?JSON.parse(JSON.stringify(o)):o),spec=G.net==='spec';
  // 1) 不需要完整快照也能套用的部分：手牌、潮光、確認、特效、音效、勝負
  G.t=s.gt;G.time=s.time;G.dbl=s.dbl;G.wx=s.wx?M(s.wx,0):null;G.zones=s.zones.map(z=>M(z,0));
  const me=s.P[spec?0:1],foe=s.P[spec?1:0];
  for(const [n,p] of Gs.pending)if(n<=s.ack){NET.stats.intentsAcked++;NET.stats.ackMs.push(t-p.at);Gs.pending.delete(n)}
  let held=0;for(const p of Gs.pending.values())held+=p.cost;
  const P0=G.P[0];P0.energy=Math.max(0,me.energy-held);P0.freeze=me.freeze;P0.crowns=me.crowns;
  if(P0.hv!==me.hv||P0.hand.length!==me.hand.length){P0.hand=me.hand.map(h=>h.stolen?{id:h.id,stolen:true}:{id:h.id});P0.q=[me.next];P0.hv=me.hv}
  const P1=G.P[1];P1.energy=foe.energy;P1.crowns=foe.crowns;P1.hand=foe.hand;P1.q=[foe.next];
  for(const f of s.fx){const m=M(f,0);res(m);m.t=0;G.fx.push(m)}
  for(const p of s.parts)Gs.mirror?orig.addPart(W-p[0],H-p[1],COL[p[2]]||p[2],p[3]):orig.addPart(p[0],p[1],p[2],p[3]);
  for(const k of s.sfx)orig.sfx(k);
  for(const id of s.toast)if(CARD[id])orig.toast(CARD[id]);
  if(s.pong&&s.pong!==Gs.lastPong){Gs.lastPong=s.pong;const r=Math.round(now()-s.pong);if(r>=0&&r<10000){NET.stats.rtt.push(r);if(NET.stats.rtt.length>300)NET.stats.rtt.shift()}}
  if(s.over&&!Gs.overShown){Gs.overShown=true;G.over=true;G.endT=0;G.res=spec?s.res:s.res===0?1:s.res===1?0:-1;setTimeout(()=>showResult(),1400)}
  // 2) 實體：差量要有對應的完整快照才能還原；缺了就請主機馬上補一張
  if(s.full){const km={};for(const o of s.ents.concat(s.projs))km[o['#']]=o;Gs.keys.set(s.s,km);for(const k of Gs.keys.keys())if(k<s.s-60)Gs.keys.delete(k);if(!spec)NET.tx.send({t:'kack',k:s.s})}
  const base=s.full?null:Gs.keys.get(s.k);
  // 缺基準時：對手請主機補完整快照；觀眾（不能請求）改用自己手上最新的狀態當底，只有沒見過的實體要等下一張完整快照
  if(!s.full&&!base){st.keyMiss++;if(!spec&&t-(Gs.askedKey||0)>300){Gs.askedKey=t;NET.tx.send({t:'needkey'})}if(!spec)return}
  const full=o=>{const m=s.full?o:Object.assign({},(base?base[o['#']]:Gs.raw.get(o['#']))||{},o);if(m.kind==null&&m.k==null&&!s.full&&!base)return null;Gs.raw.set(m['#'],m);return m};
  const seen=new Set(),mk=(o,list)=>{const fo=full(o);if(!fo){seen.add(o['#']);return null}const f=M(fo,0),id=f['#'];seen.add(id);let e=Gs.byId.get(id);
    if(!e){e={};Gs.byId.set(id,e);Object.assign(e,f);e._fx=e.x;e._fy=e.y}else{const px=e.x,py=e.y;Object.assign(e,f);e._fx=px;e._fy=py;e.x=px;e.y=py}
    e._tx=f.x;e._ty=f.y;e._rt=t;list.push(e);return e};
  const ents=[],projs=[];for(const o of s.ents)mk(o,ents);for(const o of s.projs)mk(o,projs);
  for(const id of [...Gs.byId.keys()])if(!seen.has(id))Gs.byId.delete(id);
  for(const id of [...Gs.raw.keys()])if(!seen.has(id))Gs.raw.delete(id);
  for(const e of ents.concat(projs))for(const k in e)if(e[k]&&typeof e[k]==='object'&&k!=='tr')e[k]=res(e[k]);
  G.ents=ents;G.projs=projs;
  const lane=a=>(Gs.mirror?[a[1],a[0],a[2]]:a).map(i=>Gs.byId.get(i));G.T=Gs.mirror?[lane(s.T[1]),lane(s.T[0])]:[lane(s.T[0]),lane(s.T[1])]; // 轉 180 度後左右路對調
}

/* ---------- 改寫遊戲函式（只在雙人對戰中生效） ---------- */
addFx=function(f){const n=G?G.fx.length:0;orig.addFx(f);if(G&&G.net==='host'&&G.fx.length>n&&G.fx[G.fx.length-1]===f){const o=ser(f,0);if(o)HO.out.fx.push(o)}};
addPart=function(x,y,col,sp){orig.addPart(x,y,col,sp);if(G&&G.net==='host'&&HO.out.parts.length<80)HO.out.parts.push([Math.round(x),Math.round(y),col,sp||60])};
sfx=function(k,vol){orig.sfx(k,vol);if(G&&G.net==='host'&&k!=='card'&&k!=='ready'&&k!=='play')HO.out.sfx.push(k)};
play=function(P,i,x,y){
  if(!G||!G.net)return orig.play(P,i,x,y);
  if(G.net==='host'){const id=P.hand[i]&&P.hand[i].id,ok=orig.play(P,i,x,y);if(ok&&P.team===0)HO.out.toast.push(id);return ok}
  if(G.net==='spec')return false;
  // 對手：本地先檢查，送出意圖，立刻扣潮光並畫落點，等主機確認
  if(G.over||P!==G.P[0])return false;const h=P.hand[i];if(!h)return false;const c=CARD[h.id];
  if(P.energy<c.cost||!canPlace(0,c,x,y))return false;
  for(const p of Gs.pending.values())if(p.i===i)return false;
  const n=++Gs.nextN;Gs.pending.set(n,{i,cost:c.cost,at:now()});P.energy-=c.cost;
  const msg={t:'intent',n,i,id:h.id,x:Math.round((W-x)*10)/10,y:Math.round((H-y)*10)/10};NET.tx.send(msg);NET.stats.intentsSent++;
  orig.addFx({k:'ring',x,y,r0:6,r1:c.r||34,col:'#2E7BFF',dur:.45});orig.sfx('play');
  const resend=()=>{if(Gs.pending.has(n)&&G&&G.net){if(now()-Gs.pending.get(n).at>4000){Gs.pending.delete(n);NET.stats.rejects++;banner('出牌沒有送達');return}NET.tx.send(msg);setTimeout(resend,700)}};setTimeout(resend,700);
  return true};
update=function(dt){
  if(!G||!G.net)return orig.update(dt);
  if(G.net==='host'){const s0=S.admin.energy;S.admin.energy=false;orig.update(dt);S.admin.energy=s0;
    HO.acc+=dt*1000;if(HO.acc>=SNAP_MS){HO.acc=0;hostSnapshot()}
    if(HO.lastHeard&&now()-HO.lastHeard>6000&&!G.over&&!HO.warned){HO.warned=true;banner('對手連線不穩')}
    return}
  // 對手：不跑戰鬥邏輯，只內插位置、推進特效
  const t=now();for(const e of G.ents.concat(G.projs)){if(e._rt==null)continue;const a=Math.min(1,(t-e._rt)/SNAP_MS);e.x=e._fx+(e._tx-e._fx)*a;e.y=e._fy+(e._ty-e._fy)*a;if(e.kind==='unit')e.age=(e.age||0)+dt}
  const P=G.P[0];if(G.net==='guest'&&!G.over&&P.freeze<=0)P.energy=Math.min(10,P.energy+(G.dbl?2:1)/2.8*dt);
  G.t+=dt;updFx(dt);
  if(!G.over&&NET.stats.lastSnapAt&&t-NET.stats.lastSnapAt>5000&&!Gs.lostShown){Gs.lostShown=true;banner(G.net==='spec'?'這場已經結束或斷線':'主機連線中斷')}};

  if(G.net==='spec'){const nm=Gs.names||['房主','對手'];ov(`<div class="result" style="display:flex;flex-direction:column;align-items:center"><h1 class="gt ${w===-1?'draw':'win'}" id="pvSpecR"></h1><div class="reward panel" style="font-size:18px">${G.P[0].crowns} : ${G.P[1].crowns}</div><p class="ovSub gt">真人場觀戰結束</p><div class="btnRow"><button class="btn gbtn b-white" id="rHome">回大廳</button></div></div>`);$('#pvSpecR').textContent=w===-1?'平手':nm[w]+' 勝利';$('#rHome').onclick=()=>{closeOv();exitBattle()};return}const t=w===0?['勝利','win']:w===1?['落敗','lose']:['平手','draw'];
  const st=NET.stats,med=a=>{if(!a.length)return '—';const b=[...a].sort((x,y)=>x-y);return Math.round(b[b.length>>1])+' ms'};

   <p class="ovSub" style="font-size:12px;margin:0">${NET.role==='guest'?'來回延遲 '+med(st.rtt)+'・出牌到確認 '+med(st.ackMs):'你是房主'}・雙人對戰不影響金幣和獎盃</p>
   <div class="btnRow"><button class="btn gbtn b-white" id="rHome">回大廳</button></div></div>`);

/* ---------- 好友與線上大廳（claude.ai 帳號） ---------- */
const SO={room:undefined,user:null,me:null,myId:null,peers:[],names:{},inv:null,dec:null,seenInv:{},pendingNames:new Set()};
const friends=()=>(S.friends=Array.isArray(S.friends)?S.friends:[]);
const pidOf=p=>p.by||(p.presence&&p.presence.sr&&p.presence.sr.id)||null;
const nameOf=id=>(id&&SO.names[id])||'神秘玩家';
async function social(){
  if(SO.room!==undefined)return SO.room;SO.room=null;
  const [room,user]=await Promise.all([useCap('room'),useCap('user')]);
  if(!room)return null;SO.room=room;SO.user=user;
  try{SO.me=user?await user.me():null}catch(e){SO.me=null}SO.myId=SO.me&&SO.me.id||null;if(SO.myId)SO.names[SO.myId]=SO.me.name||'你';
  room.onPeers(ch=>{SO.peers=ch.peers.filter(p=>!p.sameTab&&p.presence&&p.presence.sr);resolveNames(SO.peers.map(pidOf).concat(friends().map(f=>f.id)));onLobby()});
  pushPres();return room}
async function resolveNames(list){if(!SO.user||!SO.user.profiles)return;const need=[...new Set(list.filter(id=>id&&!SO.names[id]&&!SO.pendingNames.has(id)))];if(!need.length)return;
  need.forEach(id=>SO.pendingNames.add(id));
  try{const ps=await SO.user.profiles(need);for(const id of need){const p=ps&&ps[id];if(p&&p.name)SO.names[id]=p.name}}catch(e){}

function pushPres(){if(!SO.room)return;const st=G&&G.net?'battle':NET.role?'wait':G&&!$('#battle').hidden?'ai':'idle';
  const mt=NET.role==='host'&&G&&G.net==='host'&&!G.over?{code:NET.code,h:myName(),g:HO.guestName,at:HO.startAt||0}:null;
  SO.room.presence({sr:{v:1,id:SO.myId,st,fr:friends().map(f=>f.id).slice(0,40),inv:SO.inv,dec:SO.dec,mt}}).catch(()=>{})}

    if(f&&!f.ok&&(sr.fr||[]).includes(me)){f.ok=true;save()}

    const inv=sr.inv;if(inv&&inv.to===me&&f&&f.ok&&Date.now()-inv.at<60000&&!SO.seenInv[inv.code]){SO.seenInv[inv.code]=1;showInvite(pid,inv)}
    // 我邀的人拒絕了
    if(SO.inv&&sr.dec&&sr.dec.to===me&&sr.dec.code===SO.inv.code){SO.inv=null;pushPres();const s=$('#pvSt');if(s)s.textContent=nameOf(pid)+' 現在不方便，邀請已取消。';if(NET.role==='host'&&!(G&&G.net)){NET.tx&&NET.tx.close();NET.tx=null;NET.role=null}}}

function addFriend(pid){if(!pid||friends().some(f=>f.id===pid))return;friends().push({id:pid,ok:false});save();pushPres();onLobby()}

    <div class="btnRow"><button class="btn gbtn b-white" id="pvNo">不要</button><button class="btn gbtn b-gold" id="pvYes">接受</button></div><p class="ovSub" id="pvSt" style="font-size:13px"></p></div>`);

const stTxt={idle:'在大廳',ai:'正在打電腦',wait:'等人加入',battle:'對戰中'};

  if(!SO.myId){box.innerHTML='<p class="ovSub" style="font-size:13px;margin:0">讀不到你的帳號，暫時不能加好友；可以用房間代碼對戰。</p>';return}
  const online=new Map();for(const p of SO.peers){const pid=pidOf(p);if(pid&&pid!==SO.myId)online.set(pid,p.presence.sr)}

  const btnS='class="btn gbtn b-gold" style="font-size:13px;padding:6px 10px"',btnW='class="btn gbtn b-white" style="font-size:13px;padding:6px 10px"';

  const fr=friends();if(!fr.length)h+='<p class="ovSub" style="font-size:12px;margin:0">還沒有好友。下面的線上玩家按「加好友」，對方也加你就成立。</p>';

    const right=f.ok&&sr&&sr.st==='idle'?`<button ${btnS} data-ch="${esc(f.id)}">挑戰</button>`:`<button ${btnW} data-rm="${esc(f.id)}">移除</button>`;h+=row(f.id,right,sub)}
  const reqs=[...online].filter(([pid,sr])=>(sr.fr||[]).includes(SO.myId)&&!fr.some(f=>f.id===pid));
  if(reqs.length){h+=`<div style="font-weight:900;text-align:left;width:100%;margin-top:6px">想加你好友</div>`;for(const [pid] of reqs)h+=row(pid,`<button ${btnS} data-add="${esc(pid)}">接受</button>`,'線上')}
  const others=[...online].filter(([pid])=>!fr.some(f=>f.id===pid)&&!reqs.some(r=>r[0]===pid));
  h+=`<div style="font-weight:900;text-align:left;width:100%;margin-top:6px">線上玩家（${others.length}）</div>`;
  if(!others.length)h+='<p class="ovSub" style="font-size:12px;margin:0">現在沒有其他人打開這個遊戲。</p>';
  for(const [pid,sr] of others)h+=row(pid,`<button ${btnW} data-add="${esc(pid)}">加好友</button>`,stTxt[sr.st]||'線上');
  const lm=liveMatches();if(lm.length){h+=`<div style="font-weight:900;text-align:left;width:100%;margin-top:6px">真人場（可觀戰）</div>`;
    for(const m of lm)h+=`<div style="display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.7)"><b class="pvM" data-c="${m.code}" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b><button ${btnW} data-sp="${m.code}">觀戰</button></div>`}
  box.innerHTML=h;
  box.querySelectorAll('.pvM').forEach(el=>{const m=lm.find(x=>x.code===el.dataset.c);if(m)el.textContent=m.h+' vs '+m.g});
  box.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const m=lm.find(x=>x.code===b.dataset.sp);if(m)spectate(m.code,[m.h,m.g])});
  box.querySelectorAll('.pvN').forEach(el=>el.textContent=nameOf(el.dataset.id));
  box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addFriend(b.dataset.add));
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removeFriend(b.dataset.rm));
  box.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>challenge(b.dataset.ch));
  const me=$('#pvMe');if(me)me.textContent=nameOf(SO.myId)}

/* ---------- 開房、加入、開戰 ---------- */
const myLv=()=>{const o={};for(const id of S.deck)o[id]=lvOf(id);return o};
const myName=()=>(SO.me&&SO.me.name)||'玩家';
function onHostMsg(o){HO.lastHeard=now();HO.warned=false;
  if(o.t==='hello'&&!HO.started){HO.started=true;HO.guestId=o.id;HO.guestName=String(o.name||'對手').slice(0,16);HO.guestLv=o.lv||{};NET.peerName=HO.guestName;
    const deck=(o.deck||[]).filter(id=>CARD[id]).slice(0,8);if(deck.length<8)return;
    const arena=arenaIdx(),st={t:'start',arena,hostName:myName(),hostDeck:S.deck.slice()};NET.tx.send(st);setTimeout(()=>NET.tx&&NET.tx.send(st),400);
    closeOv();SO.inv=null;HO.startAt=Date.now();hostStart(deck,arena);pushPres();return}
  if(o.t==='ping'){HO.lastPing=o.at;return}
  if(o.t==='needkey'){HO.ackKey=0;return}
  if(o.t==='kack'){if(HO.keys.has(o.k)&&o.k>HO.ackKey)HO.ackKey=o.k;return}
  if(o.t==='intent'&&G&&G.net==='host'){if(o.n<=HO.lastN)return;HO.lastN=o.n;const P=G.P[1];let i=o.i;if(!P.hand[i]||P.hand[i].id!==o.id)i=P.hand.findIndex(h=>h.id===o.id);
    const x=+o.x,y=+o.y;if(i>=0&&Number.isFinite(x)&&Number.isFinite(y)){if(!orig.play(P,i,x,y))NET.stats.hostRejects=(NET.stats.hostRejects||0)+1}return}
  if(o.t==='bye'&&G&&G.net==='host'&&!G.over){banner('對手投降');endBattle(0)}}
function hostStart(deck,arena){
  orig.startBattle({opp:deck,arena});G.net='host';dropResume();HO.seq=0;HO.keys=new Map();HO.ackKey=0;HO.lastFull=-99;HO.lastN=-1;HO.out={fx:[],parts:[],sfx:[],toast:[]};
  const P=G.P[1];P.ai=false;P.lv=id=>Math.max(1,Math.min(12,(HO.guestLv[id]|0)||1));
  const glv=Math.max(1,Math.round(deck.reduce((a,id)=>a+P.lv(id),0)/8));
  G.ents=G.ents.filter(e=>!(e.kind==='tower'&&e.team===1));G.T[1]=[mkTower(1,90,112,false,glv),mkTower(1,270,112,false,glv),mkTower(1,180,64,true,glv)];G.T[1].forEach(t=>G.ents.push(t));
  const fn=$('#foeName');if(fn)fn.textContent=HO.guestName;banner('雙人對戰・開戰！')}
function guestStart(o){
  orig.startBattle({opp:(o.hostDeck||[]).filter(id=>CARD[id]),arena:o.arena|0});G.net='guest';Gs.mirror=true;Gs.raw.clear();dropResume();
  G.ents=[];G.projs=[];G.P[1].ai=false;Gs.byId.clear();Gs.keys=new Map();Gs.lastSeq=0;Gs.pending.clear();Gs.overShown=false;Gs.lostShown=false;
  NET.peerName=String(o.hostName||'房主').slice(0,16);const fn=$('#foeName');if(fn)fn.textContent=NET.peerName;
  banner('雙人對戰・開戰！');pushPres();
  const ping=()=>{if(NET.role!=='guest'||!NET.tx)return;NET.tx.send({t:'ping',at:Math.round(now())});setTimeout(ping,1000)};ping()}
/* ---------- 觀戰真人場 ---------- */
function specUI(on,me){const hb=document.querySelector('.handbar');if(hb)hb.style.visibility=on?'hidden':'';const mn=$('#meName');if(mn)mn.textContent=on?(me||'房主'):'你'}
const ago=at=>{const m=at?Math.floor((Date.now()-at)/60000):0;return m<1?'剛開打':'已打 '+m+' 分鐘'};
function liveMatches(){const out=[];for(const p of SO.peers){const mt=p.presence.sr&&p.presence.sr.mt;if(!mt||!/^[A-Z0-9]{4}$/.test(mt.code||''))continue;
  const h=String(mt.h||'玩家').slice(0,16),g=String(mt.g||'玩家').slice(0,16);out.push({code:mt.code,h,g,at:mt.at||0})}return out}
async function spectate(code,names){if(G&&!$('#battle').hidden&&G.net)return;if(NET.tx){NET.tx.close();NET.tx=null}
  closeOv();NET.code=code;NET.role='spec';Gs.names=names||null;banner('連線觀戰中…');
  const tx=await connect(code,'spec');if(!tx){NET.role=null;banner(IN_CLAUDE?'連不上這場：需要登入 claude.ai 並被加進分享名單':'連不上這場');return}
  if(NET.code!==code||NET.role!=='spec'){tx.close();return}
  NET.tx=tx;NET.kind=tx.kind;Gs.started=false;
  tx.onMsg(o=>{if(o.t!=='snap')return;
    if(!Gs.started){if(!o.full)return;Gs.started=true;if(o.nm)Gs.names=o.nm.map(x=>String(x||'玩家').slice(0,16));
      if(typeof exitBattle==='function'&&G&&!$('#battle').hidden&&!G.net)orig.exitBattle();
      orig.startBattle({arena:o.ar|0});G.net='spec';G.P.forEach(P=>P.ai=false);G.ents=[];G.projs=[];dropResume();
      Gs.mirror=false;Gs.raw.clear();Gs.byId.clear();Gs.keys=new Map();Gs.lastSeq=0;Gs.pending.clear();Gs.overShown=false;Gs.lostShown=false;
      const fn=$('#foeName');if(fn)fn.textContent=Gs.names?Gs.names[1]:'對手';specUI(true,Gs.names&&Gs.names[0]);banner('觀戰：'+(Gs.names?Gs.names.join(' vs '):'真人場'))}
    guestApply(o)});
  setTimeout(()=>{if(NET.role==='spec'&&!Gs.started)banner('這場已經結束了')},8000)}
// 主 session 的觀戰室會呼叫這個，把真人場列在 AI 場下面
window.SPEC_EXTRA=()=>{if(IN_CLAUDE&&SO.room===undefined)social();
  return liveMatches().map(m=>({title:m.h+' vs '+m.g,sub:'雙人對戰進行中・'+ago(m.at),onWatch:()=>{
    // 從 AI 觀戰室點進來：先關掉背景的電腦對打，免得一直在跑
    try{if(typeof SPEC!=='undefined'&&SPEC.on&&typeof specClose==='function')specClose()}catch(e){}
    spectate(m.code,[m.h,m.g])}}))};
function onGuestMsg(o){
  if(o.t==='start'&&!(G&&G.net)){closeOv();guestStart(o);return}
  if(o.t==='snap'){guestApply(o);return}
  if(o.t==='bye'&&G&&G.net&&!G.over){banner('房主離開了');G.over=true;G.res=0;Gs.overShown=true;setTimeout(()=>showResult(),1400)}}
function waitBox(code,who){lobby(`<div class="ovTitle gt">${who?'等好友接受':'房間代碼'}</div>${who?'<p class="ovSub" style="margin:0"><b id="pvWho"></b></p>':''}<div id="pvCode" style="font:900 44px/1.1 system-ui;letter-spacing:8px;color:#1B1A33;margin:6px 0">${code}</div><p class="ovSub" id="pvSt">連線中…</p>${!IN_CLAUDE&&!who?'<div style="display:flex;gap:6px;width:100%"><input id="pvLink" readonly aria-label="邀請連結" style="flex:1;min-width:0;font:700 12px system-ui;padding:7px;border-radius:10px;border:2px solid #1B1A33"><button class="btn gbtn b-gold" id="pvCopy" style="margin:0;padding:6px 12px;font-size:14px">複製連結</button></div><p class="ovSub" style="font-size:12px;margin:0">朋友點連結就會直接加入這一房</p>':''}`);
  if(who)$('#pvWho').textContent=nameOf(who);
  const L=$('#pvLink');if(L){L.value=location.origin+location.pathname+'?room='+code;$('#pvCopy').onclick=()=>{const done=()=>{$('#pvCopy').textContent='已複製'};try{navigator.clipboard.writeText(L.value).then(done,()=>{L.select();done()})}catch(e){L.select();done()}}}}
async function host(code,who){code=code||code4();if(NET.tx){NET.tx.close();NET.tx=null}NET.code=code;NET.role='host';HO.started=false;HO.lastHeard=0;
  waitBox(code,who);pushPres();
  const tx=await connect(code,'host');if(!tx){const s=$('#pvSt');if(s)s.textContent=IN_CLAUDE?'連不上：需要登入 claude.ai，並被加進這個遊戲的分享名單。':'連不上任何中繼。';NET.role=null;return}
  if(NET.code!==code){tx.close();return}
  NET.tx=tx;NET.kind=tx.kind;tx.onMsg(onHostMsg);const s=$('#pvSt');if(s)s.textContent=who?'已送出邀請，等對方按接受…':'把代碼告訴朋友，等對方加入…'}
async function join(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);const st=$('#pvSt');if(code.length!==4){if(st)st.textContent='代碼是 4 個字';return}
  if(NET.tx){NET.tx.close();NET.tx=null}NET.code=code;NET.role='guest';if(st)st.textContent='連線中…';
  const tx=await connect(code,'guest');if(!tx){const s=$('#pvSt');if(s)s.textContent=IN_CLAUDE?'連不上：需要登入 claude.ai，並被加進這個遊戲的分享名單。':'連不上任何中繼。';NET.role=null;return}
  NET.tx=tx;NET.kind=tx.kind;tx.onMsg(onGuestMsg);
  const hello={t:'hello',id:myId,name:myName(),deck:S.deck.slice(),lv:myLv()};
  const say=()=>{if(G&&G.net)return;if(NET.role!=='guest'||NET.tx!==tx)return;tx.send(hello);setTimeout(say,1000)};say();
  const s=$('#pvSt');if(s)s.textContent='已送出加入請求，等房主回應…'}
function lobby(inner){ov(`<div class="pvBox" style="display:flex;flex-direction:column;align-items:center;gap:6px;width:min(340px,86vw);max-height:80vh;overflow:auto">${inner}<div class="btnRow"><button class="btn gbtn b-white" id="pvX">關閉</button></div></div>`);
  $('#pvX').onclick=()=>{if(NET.tx&&!(G&&G.net)){NET.tx.close();NET.tx=null;NET.role=null}SO.inv=null;pushPres();closeOv()}}
function openLobby(){if(G&&!$('#battle').hidden)return;
  lobby(`<div class="ovTitle gt">雙人對戰</div>${IN_CLAUDE?'<p class="ovSub" style="margin:0;font-size:13px">你是 <b id="pvMe"></b></p>':''}
   <div id="pvSocial" style="display:flex;flex-direction:column;gap:6px;width:100%"></div>
   <div style="font-weight:900;text-align:left;width:100%;margin-top:8px">用房間代碼</div>
   <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center"><button class="btn gbtn b-gold" id="pvHost">開房間</button><input id="pvIn" maxlength="4" placeholder="代碼" autocomplete="off" aria-label="房間代碼" style="width:96px;font:900 20px system-ui;text-align:center;letter-spacing:3px;padding:7px;border-radius:12px;border:3px solid #1B1A33;text-transform:uppercase"><button class="btn gbtn b-white" id="pvJoin">加入</button></div>
   <p class="ovSub" id="pvSt" style="font-size:13px;margin:0"></p>`);
  $('#pvHost').onclick=()=>host();$('#pvJoin').onclick=()=>join($('#pvIn').value);$('#pvIn').onkeydown=e=>{if(e.key==='Enter')join($('#pvIn').value)};
  renderSocial();if(IN_CLAUDE)social().then(()=>{renderSocial();const me=$('#pvMe');if(me)me.textContent=nameOf(SO.myId)})}
// 首頁入口：排在「觀戰室」後面，樣式跟挑戰模式、觀戰室一致；首頁每次重畫都補回來
function placeBtn(){if(curView!=='home'||$('#pvpBtn'))return;const after=$('#specB')||$('#chal')||$('#go');if(!after)return;
  const b=document.createElement('button');b.id='pvpBtn';b.className='chalBtn gbtn b-green';b.innerHTML='👥 雙人對戰<small>和好友連線對打、用房間代碼開房，或觀看真人場</small>';b.onclick=openLobby;after.insertAdjacentElement('afterend',b)}
if(typeof render_view==='function'){const o=render_view;render_view=function(){const r=o.apply(this,arguments);try{placeBtn()}catch(e){}return r}}
placeBtn();
let lastSt='';setInterval(()=>{placeBtn();
  const st=G&&G.net?'battle':NET.role?'wait':G&&!$('#battle').hidden?'ai':'idle';if(st!==lastSt){lastSt=st;pushPres()}},500);
// 分享連結（?room=代碼）：首頁沒有其他視窗時，自動打開雙人面板並加入；用過就從網址拿掉，重新整理不會再加入一次
{const pre=(qs.get('room')||'').toUpperCase();if(/^[A-Z0-9]{4}$/.test(pre)){let tries=0;const go=()=>{if(++tries>120)return;
  if(curView!=='home'||$('#ovRoot').innerHTML.trim()||(G&&!$('#battle').hidden)){setTimeout(go,500);return}
  try{history.replaceState(null,'',location.pathname)}catch(e){}openLobby();$('#pvIn').value=pre;join(pre)};setTimeout(go,800)}}
// 已經有好友的人，一打開遊戲就上線，好友才邀得到
if(IN_CLAUDE&&friends().length)setTimeout(()=>social(),1500);
window.__PVP.api={host,join,openLobby,idOf,social,SO,spectate,liveMatches};
})();
</script>

<script>(()=>{const V="2026-11-09-45d6ff734d";let pending=false;
const busy=()=>typeof G!=='undefined'&&G&&document.querySelector('#battle')&&!document.querySelector('#battle').hidden;
const check=()=>fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=t.trim();if(t&&t!==V)pending=true;if(pending&&!busy())location.reload()}).catch(()=>{});
